<!DOCTYPE html>
<html lang="es" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Estadísticas y métricas de cumplimiento en Tracker de hábitos." />
  <title>Tracker de hábitos — Estadísticas</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <svg class="brand-logo" viewBox="0 0 28 28" aria-hidden="true">
          <rect width="28" height="28" rx="7" fill="#22c55e" />
          <path d="M8 14.5L12.2 18.5L20 10" stroke="#06210f" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Tracker de hábitos</span>
      </a>
      <nav class="nav-links" aria-label="Navegación principal">
        <a class="nav-link" href="index.html">Hoy</a>
        <a class="nav-link active" href="estadisticas.html">Estadísticas</a>
        <a class="nav-link" href="habitos.html">Hábitos</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="page-header">
      <p class="page-kicker">Métricas y progreso</p>
      <h1 class="page-title">Estadísticas de hábitos</h1>
      <p class="page-subtitle">Revisa el porcentaje de avance diario por cada hábito activo.</p>
    </section>

    <section class="grid-summary" aria-label="Indicadores generales">
      <article class="card">
        <div class="metric-label">Avance promedio hoy</div>
        <div class="metric-value" id="stats-avg">0%</div>
      </article>
      <article class="card">
        <div class="metric-label">Hábitos activos</div>
        <div class="metric-value" id="stats-active">0</div>
      </article>
      <article class="card">
        <div class="metric-label">Mejoras aplicadas</div>
        <div class="metric-value">3 / 3</div>
      </article>
    </section>

    <section class="card" aria-label="Desglose por hábito">
      <h2 class="habit-name" style="margin-bottom: 14px;">Estado por hábito hoy</h2>
      <div class="bars-list" id="stats-bars"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>

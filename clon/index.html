<!DOCTYPE html>
<html lang="es" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tracker de hábitos: seguimiento diario, progreso y constancia." />
  <title>Tracker de hábitos — Hoy</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <svg class="brand-logo" viewBox="0 0 28 28" aria-hidden="true">
          <rect width="28" height="28" rx="7" fill="#22c55e" />
          <path d="M8 14.5L12.2 18.5L20 10" stroke="#06210f" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Tracker de hábitos</span>
      </a>
      <nav class="nav-links" aria-label="Navegación principal">
        <a class="nav-link active" href="index.html">Hoy</a>
        <a class="nav-link" href="estadisticas.html">Estadísticas</a>
        <a class="nav-link" href="habitos.html">Hábitos</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="page-header">
      <p class="page-kicker">Seguimiento diario</p>
      <h1 class="page-title">Tu avance de hoy</h1>
      <p class="page-subtitle">Marca cada hábito completado para mantener tu constancia diaria.</p>
    </section>

    <section class="grid-summary" aria-label="Resumen de progreso">
      <article class="card">
        <div class="metric-label">Cumplimiento hoy</div>
        <div class="metric-value" id="today-pct">0%</div>
        <div class="progress-track">
          <div class="progress-fill" id="today-progress-bar" style="width: 0%"></div>
        </div>
      </article>
      <article class="card">
        <div class="metric-label">Hábitos marcados</div>
        <div class="metric-value" id="today-count">0 de 0</div>
      </article>
      <article class="card">
        <div class="metric-label">Racha actual</div>
        <div class="metric-value" id="streak-days">0 días</div>
      </article>
    </section>

    <section aria-label="Lista de hábitos de hoy">
      <div class="habit-list" id="today-habits-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>

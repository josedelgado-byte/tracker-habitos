<!DOCTYPE html>
<html lang="es" translate="no">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Administra tus hábitos y metas diarias en Tracker de hábitos." />
  <title>Tracker de hábitos — Hábitos</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="brand" href="index.html">
        <svg class="brand-logo" viewBox="0 0 28 28" aria-hidden="true">
          <rect width="28" height="28" rx="7" fill="#22c55e" />
          <path d="M8 14.5L12.2 18.5L20 10" stroke="#06210f" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
        <span>Tracker de hábitos</span>
      </a>
      <nav class="nav-links" aria-label="Navegación principal">
        <a class="nav-link" href="index.html">Hoy</a>
        <a class="nav-link" href="estadisticas.html">Estadísticas</a>
        <a class="nav-link active" href="habitos.html">Hábitos</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="page-header">
      <p class="page-kicker">Configuración</p>
      <h1 class="page-title">Administrar hábitos</h1>
      <p class="page-subtitle">Agrega nuevos hábitos o elimina los que ya no necesites.</p>
    </section>

    <section class="card" style="margin-bottom: 20px;" aria-label="Nuevo hábito">
      <form class="form-grid" id="add-habit-form">
        <div class="field">
          <label for="habit-name">Nombre del hábito</label>
          <input id="habit-name" name="habitName" type="text" placeholder="Ej. Caminar 25 minutos" required />
        </div>
        <div class="field">
          <label for="habit-goal">Meta diaria</label>
          <input id="habit-goal" name="habitGoal" type="text" placeholder="Ej. 25 min al día" />
        </div>
        <button class="btn btn-primary" type="submit">Agregar hábito</button>
      </form>
    </section>

    <section aria-label="Hábitos registrados">
      <div class="habit-list" id="manage-habits-list"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
